<div class="row">
<form [formGroup]="formGroup">
    @if (isContrat()) {
    <div class="col-md-6 mb-3">
      <h6>Intitulé du contrat</h6>
        <div>{{ formGroup.get('Intitule')?.value }}</div>

    </div>
  } @else {
    <div class="col-md-6 mb-3">
      <h6>Intitulé du projet</h6>
        <div>{{ formGroup.get('Intitule')?.value }}</div>

    </div>
  }
</form>
</div>
