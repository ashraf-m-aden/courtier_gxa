<div class="row">
  @if (isContrat()) {
    <div class="col-md-6 mb-3">
      <h6>Intitulé du contrat</h6>
      @if (isEdit()) {
        <div>{{ formGroup.get('intitule')?.value }}</div>
      } @else {
        <input class="form-control" formControlName="intitule" />
      }
    </div>
  } @else {
    <div class="col-md-6 mb-3">
      <h6>Intitulé du projet</h6>
      @if (isEdit()) {
        <div>{{ formGroup.get('intitule')?.value }}</div>
      } @else {
        <input class="form-control" formControlName="intitule" />
      }
    </div>
  }
</div>
