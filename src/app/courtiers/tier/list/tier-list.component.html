<div class="tiers-page container-fluid">
  <div class="search-card card p-4 mb-4 shadow-sm">
    <div class="row align-items-end">

      <!-- Recherche -->
      <div class="col-md-6 col-10 mb-3 mb-md-0">
        <label for="search" class="form-label">
          <h5>Recherche de tiers</h5>
        </label>
        <div class="input-group custom-input-group">
          <input
            type="search"
            id="search"
            class="form-control"
            placeholder="Nom, téléphone, adresse..."
            [(ngModel)]="searchTerm"
            (keypress)="onKeyPress($event)"
          />
          <span class="input-group-text search-icon">
            <mat-icon>search</mat-icon>
          </span>
        </div>
      </div>

      <!-- Bouton Nouveau -->
      <div class="col-md-2 d-flex justify-content-end">
        <button
          type="button"
          class="btn btn-primary new-tier-btn"
          [routerLink]="['/courtiers/tiers/nouveau']"
          routerLinkActive="active"
        >
          <mat-icon>add</mat-icon> Nouveau tier
        </button>
      </div>

    </div>
  </div>

  <!-- Tableau -->
  <div class="card shadow-sm table-card p-3">
    @if(isLoading()){
      <div class="loading-spinner">
        <mat-spinner diameter="50"></mat-spinner>
      </div>
    } @else {
      <table class="table custom-table w-100">
        <thead class="table-header">
          <tr>
            <th>Code P</th>
            <th>Raison Sociale</th>
            <th>Ville</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (element of allTiers(); track element){
            <tr>
              <td>{{ element?.codp }}</td>
              <td>{{ element?.rsociale }}</td>
              <td>{{ element?.ville }}</td>
              <td>
                <button
                  class="btn btn-sm btn-outline-primary edit-btn"
                  (click)="editTier(element)"
                >
                  <mat-icon>edit</mat-icon> Voir détails
                </button>
              </td>
            </tr>
          }
          @if (allTiers().length === 0){
            <tr>
              <td colspan="4" class="text-center">Aucun tiers trouvé</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>
</div>
