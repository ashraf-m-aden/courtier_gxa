<div class="container-fluid">
  <div class="row card p-3 m-0">
    <div class="col-12 d-flex justify-content-between">
      <h5>Liste des contrats</h5>
      <button class="btn btn-group btn-primary" (click)="nouveauContrat()">
        <mat-icon>add</mat-icon>

        Nouveau contrat
      </button>

    </div>
    <div class="col-12 mt-5">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Numéro Contrat</th>
            <th>Intitulé</th>
            <th>Date début</th>
            <th>Date fin</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for(contrat of contrats;track contrat){
          <tr>
            <td>{{ contrat.Contrat }}</td>
            <td>{{ contrat.Intitule || "-" }}</td>

            <td>{{ contrat.Debcours | date : "dd/MM/yyyy" }}</td>
            <td>{{ contrat.Fincours | date : "dd/MM/yyyy" }}</td>

            <td class="d-flex gap-2">
              <button class="btn btn-group btn-primary" (click)="voir(contrat)">
                <mat-icon>visibility</mat-icon>

                Voir
              </button>
               <button class="btn btn-group btn-primary" (click)="edit(contrat)">
                <mat-icon>edit</mat-icon>

                Modifier
              </button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
