<div class="login-container" [@fadeIn]>
  <div class="bg-rect rect1"></div>
  <div class="bg-rect rect2"></div>
  <div class="login-card">
    <h2>Connexion à GXA</h2>

    <form [formGroup]="this.loginForm" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nom d'utilisateur</mat-label>
        <input matInput formControlName="login" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mot de passe</mat-label>
        <input matInput [type]="'password'" formControlName="password" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Domaine</mat-label>
        <input matInput formControlName="domain" />
      </mat-form-field>



      <button class="login-btn" type="submit" [disabled]="this.loading()">
        Connexion @if (this.loading$ | async) {
        <div class="spinner-border text-primary" role="status"></div>
        }
      </button>
    </form>
  </div>
</div>
